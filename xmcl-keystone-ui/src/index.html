<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastLauncher</title>
    <link rel="stylesheet" href="./assets/google.font.css">
    <link rel="stylesheet" href="./assets/preload.css">
    <script src="http://launcher/flights"></script>
    <style>
        .unloaded {
            background-color: rgb(18, 18, 18);
            height: 100vh;
            width: 100vw;
            min-width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .unloaded #app {
            --bs-accent: #1565c0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .unloaded #app img {
            max-width: 42vw;
            max-height: 26vh;
            object-fit: contain;
        }
        @keyframes bs-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }
        @keyframes bs-rise {
            0% { transform: translateY(24px); opacity: 0; }
            40% { opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes bs-spin {
            0% { transform: rotate(0deg); opacity: 0.2; }
            100% { transform: rotate(360deg); opacity: 1; }
        }
        @keyframes bs-glow {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px var(--bs-accent)); }
            50% { opacity: 1; filter: drop-shadow(0 0 30px var(--bs-accent)); }
        }
        body.unloaded.bs-pulse #app { animation: bs-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        body.unloaded.bs-rise #app { animation: bs-rise 1s cubic-bezier(0.4, 0, 0.2, 1) both; }
        body.unloaded.bs-spin #app img { animation: bs-spin 1.4s ease-in-out infinite; }
        body.unloaded.bs-glow #app img { animation: bs-glow 1.6s ease-in-out infinite; }
        @media (prefers-reduced-motion: reduce) {
            body.unloaded.bs-pulse #app,
            body.unloaded.bs-pulse #app img,
            body.unloaded.bs-rise #app,
            body.unloaded.bs-rise #app img,
            body.unloaded.bs-spin #app img,
            body.unloaded.bs-glow #app img { animation: none; }
        }
    </style>
    <script>
        // Paint the very first frame with the color scheme the user had last
        // time. Without this the page would start with the default scheme and
        // visibly flip once the real theme arrives (screen "flicker").
        (function () {
            var bg = '#111318'
            try {
                if (localStorage.getItem('fastlauncher.theme.dark') === 'false') bg = '#f5f6f8'
            } catch (e) { /* ignore storage errors */ }
            document.documentElement.style.backgroundColor = bg
        })()
    </script>
</head>

<body class="overflow-hidden unloaded">
    <div id="app">
        <img src="./assets/logo.webp" alt="Logo">
    </div>
    <script>
        (function () {
            var cfg = {};
            try {
                var raw = localStorage.getItem('xmcl.bootSplash')
                if (raw) { cfg = JSON.parse(raw) || {}; }
            } catch (e) { /* ignore malformed cache */ }
            var style = cfg.style || 'pulse'
            var color = cfg.color || '#1565c0'
            if (style !== 'none') {
                document.body.classList.add('bs-' + style)
                document.documentElement.style.setProperty('--bs-accent', color)
            }
        })()
    </script>
    <script type="module" src="./windows/main/index.ts"></script>
</body>

</html>
